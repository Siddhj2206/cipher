# Builds every package. A `v*` tag makes a draft GitHub release with them (publish it by hand
# once tested); running the workflow by hand only builds them, as downloadable artifacts.
# Process: docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v="$(packaging/version.sh)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $v"
            exit 1
          fi

  linux:
    needs: version
    # The oldest supported runner: the binary needs this glibc (2.35) or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux linker dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends clang mold
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo build --release --locked -p cipher-app
      - name: AppImage and tarball
        run: packaging/linux/package.sh target/release/cipher target/dist
      - name: deb and rpm
        run: |
          v=${{ needs.version.outputs.version }}
          cargo deb -p cipher-app --no-build -o "target/dist/Cipher-$v-linux-amd64.deb"
          cargo generate-rpm -p crates/cipher-app -o "target/dist/Cipher-$v-linux-x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: target/dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
      - run: cargo build --release --locked -p cipher-app
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Installer and portable zip
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Exe target/release/cipher.exe -Out target/dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: target/dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --profile minimal
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
      - name: Signing certificate (when the secrets are set)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        if: env.MACOS_CERTIFICATE != ''
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc"
          # Add it to the search list, keeping the keychains already there.
          mapfile -t kcs < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$kc" "${kcs[@]}"
      - name: App bundle and disk image
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/package.sh "" target/dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: target/dist/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.version.outputs.version }}
          sed "s/@VERSION@/$v/g" packaging/release-notes.md > notes.md
          pre=()
          if [[ "$v" == *-* ]]; then pre=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --title "Cipher $v" \
            --notes-file notes.md --generate-notes "${pre[@]}"
