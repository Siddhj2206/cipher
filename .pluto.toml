#:schema https://raw.githubusercontent.com/Siddhj2206/pluto/main/pluto.schema.json

# Pluto demo contract for cipher, a Rust CLI.
#
# A box gets a Rust toolchain, a warm build cache, and repeatable jobs.
# Provision runs once; the target directory it builds lives on the box disk, so
# later job runs reuse the compilation.
#
# Review 3 demo: a pull request triggers `test-pr`, which runs the crate's
# tests on the PR head. There is no agent in this path. The heartbeat schedule
# stays for the observability demo.
#
# This file is committed unchanged on `demo/pluto` and `master`: the laptop box
# runs the checkout, and the daemon reads the trusted default branch to admit
# GitHub events. The two copies must parse to the same values.

[box]
resources = { cpus = 4, memory = "4GiB", disk = "20GiB" }
auto_pause = "30m"

[env]
# Keep cargo output stable in the run log.
CARGO_TERM_COLOR = "never"
RUST_BACKTRACE = "1"

[tools]
# rustc needs a C compiler/linker; cipher's .cargo/config.toml selects
# clang with mold, so install all three.
packages = ["build-essential", "clang", "mold"]

[provision]
command = '''
curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
. "$HOME/.cargo/env"
rustup component add rustfmt clippy
mkdir -p "$HOME/.local/bin"
ln -sf "$HOME/.cargo/bin/"* "$HOME/.local/bin/"
cargo build --locked
'''
timeout = "30m"

[jobs.build]
description = "build the cipher binary"
command = "cargo build --locked"
timeout = "20m"

[jobs.test]
description = "run the test suite"
command = "cargo test --locked"
timeout = "30m"

[jobs.fmt]
description = "check formatting"
command = "cargo fmt --check"
timeout = "5m"

[jobs.clippy]
description = "lint with clippy"
command = "cargo clippy --locked --all-targets"
timeout = "30m"

[jobs.heartbeat]
description = "record date, host, pwd, and trigger; the two-minute schedule runs it"
command = "scripts/pluto-demo-heartbeat"

[jobs.test-pr]
description = "run the test suite on a pull request"
command = ".pluto/test-pr.sh"
timeout = "30m"

[[schedule]]
name = "nightly-tests"
cron = "0 3 * * *"
job = "test"

[[schedule]]
name = "heartbeat"
cron = "*/2 * * * *"
job = "heartbeat"

[events.pull_request]
job = "test-pr"
actions = ["opened", "synchronize"]
