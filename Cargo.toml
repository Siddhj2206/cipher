[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["prototypes/editor-spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
cipher-text = { path = "crates/cipher-text" }
cipher-book = { path = "crates/cipher-book" }
cipher-llm = { path = "crates/cipher-llm" }
cipher-engine = { path = "crates/cipher-engine" }
rune = { git = "https://github.com/anomalyco/rune", rev = "8fc71fbf21db41920409bf6fa20ffb41ddb2f99d", features = ["tooling", "native-file-dialog"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "2.12"
keyring = "4.2"
tempfile = "3"
aho-corasick = "1.1"

# What ships: smaller and a little faster, at some build time. Symbols are stripped; panics
# still print their message and location.
[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Rune vendors patched copies of these and asks apps that build it to patch them too, since a
# dependency's `[patch]` doesn't reach the workspace that depends on it (see Rune's Cargo.toml).
# Keep the rev equal to `rune` above.
[patch.crates-io]
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "8fc71fbf21db41920409bf6fa20ffb41ddb2f99d" }
winit = { git = "https://github.com/anomalyco/rune", rev = "8fc71fbf21db41920409bf6fa20ffb41ddb2f99d" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "8fc71fbf21db41920409bf6fa20ffb41ddb2f99d" }
